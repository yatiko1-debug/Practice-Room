<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Practice Room">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0ec">
<link rel="apple-touch-icon" href="icon.png">
<title>Practice Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root {
  --bg: #eef0ec; --surface: #f8f9f6; --ink: #18221f; --muted: #5d6b66; --line: #cdd5cf;
  --accent: #1f5c57; --accent-ink: #f4faf8; --brass: #a07c2c;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111715; --surface: #18201d; --ink: #e8ece7; --muted: #94a39c;
    --line: #2b3733; --accent: #7fc4b8; --accent-ink: #0d1412; --brass: #d3b165;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-inline: 20px;
  padding-block: calc(36px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
h1, h2 { font-family: var(--font-display); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass); font-weight: 500; }
header { display: flex; flex-direction: column; gap: 6px; }
header h1 { font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1.05; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tile {
  position: relative; aspect-ratio: 1 / 1; min-width: 0;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
  padding: 20px; text-decoration: none; color: var(--ink);
  background: repeating-linear-gradient(to bottom, transparent 0 11px, var(--line) 11px 12px) 0 28% / 100% 49px no-repeat, var(--surface);
  border: 1px solid var(--line); border-radius: 4px; transition: border-color .2s, transform .2s;
}
.tile:hover { border-color: var(--accent); transform: translateY(-2px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile h2 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1; }
.tile .count { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }
.tile .glyph { position: absolute; top: 14px; right: 18px; font-family: var(--font-display); font-size: 1.6rem; color: var(--brass); }

.diary { display: flex; flex-direction: column; gap: 10px; }
.diary h2 { font-size: 1.7rem; }
textarea {
  width: 100%; min-width: 0; height: calc(10 * 1.7em + 28px); resize: vertical;
  font: inherit; font-size: 16px; line-height: 1.7; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
}
.tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
button.quiet {
  font: inherit; font-size: 14px; color: var(--accent); background: none; cursor: pointer;
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px;
}
button.quiet:hover { border-color: var(--accent); }
.status { font-size: 13px; color: var(--muted); }
details.backup { color: var(--muted); font-size: 14px; }
details.backup summary { cursor: pointer; }
details.backup .box { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
details.backup textarea { height: 7em; font-size: 13px; line-height: 1.4; font-family: ui-monospace, Menlo, monospace; }

.back { align-self: flex-start; color: var(--muted); text-decoration: none; font-size: 14px; letter-spacing: 0.04em; }
.back:hover { color: var(--accent); }
.page-title { display: flex; flex-direction: column; gap: 4px; }
.page-title h1 { font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1; }
.grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; align-items: start; }
.cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.clip {
  aspect-ratio: 16 / 10; position: relative; width: 100%; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; color: var(--muted);
}
.clip .n { position: absolute; top: 6px; left: 10px; font-family: var(--font-display); font-size: 1.2rem; color: var(--brass); z-index: 2; text-shadow: 0 0 6px var(--surface); }
.clip.empty .big { font-family: var(--font-display); font-size: clamp(2rem, 8vw, 3.4rem); opacity: .35; }
button.thumb { cursor: pointer; font: inherit; }
button.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
button.thumb .play {
  position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center;
  font-size: 18px; padding-left: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.35);
}
button.thumb:hover .play { filter: brightness(1.1); }
.clip iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.caption { font-size: 13px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; min-height: 2.6em; }
.caption.dim { color: var(--muted); }

.links { display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, auto); grid-template-columns: repeat(3, 1fr); gap: 12px 24px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row label { font-family: var(--font-display); font-size: 1.4rem; color: var(--brass); width: 1.6em; flex: none; text-align: right; }
.row input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
}
.row input.bad { border-color: #b3541e; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 640px) {
  .links { grid-auto-flow: row; grid-template-columns: 1fr; }
  .grid9 { gap: 12px 8px; }
  button.thumb .play { width: 34px; height: 34px; font-size: 14px; }
  .caption { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }

.wrap.wide { max-width: 1040px; }
.song-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.paper-wrap { min-width: 0; display: flex; justify-content: center; }
.paper-sheet {
  width: 100%; aspect-ratio: 8.5 / 11; background: #fffef9; border: 1px solid var(--line);
  box-shadow: 0 8px 28px rgba(0,0,0,.18); border-radius: 2px;
}
.paper-sheet textarea {
  width: 100%; height: 100%; resize: none; border: 0; border-radius: 2px; background: transparent; color: #1b1b1b;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; line-height: 1.55;
  padding: 7% 8%; white-space: pre; overflow: auto;
}
.paper-sheet textarea::placeholder { color: #8a8a80; }
.links.three { grid-template-rows: repeat(3, auto); grid-template-columns: 1fr; grid-auto-flow: row; max-width: 520px; }
.clip.song { text-decoration: none; color: var(--ink); text-align: center; padding: 10px; flex-direction: column; gap: 4px; }
.clip.song:hover { border-color: var(--accent); }
.clip.song .name { font-family: var(--font-display); font-size: clamp(1.1rem, 4vw, 1.7rem); line-height: 1.1; overflow-wrap: anywhere; text-wrap: balance; }
.clip.song.unnamed .name { opacity: .35; font-size: clamp(2rem, 8vw, 3.4rem); }
.links.names input { font-size: 16px; }
@media (max-width: 760px) { .song-layout { grid-template-columns: 1fr; } .paper-sheet { max-width: 520px; } }
.clip.song.import { border-style: dashed; }
.clip.song.import .name { font-size: clamp(1rem, 3.4vw, 1.4rem); color: var(--accent); }
#songdoc { height: calc(14 * 1.7em + 28px); font-size: 16px; }
.tile-link { color: var(--accent); }
button.quiet:disabled { opacity: .4; cursor: default; }
#songexport { height: calc(12 * 1.4em + 28px); font-size: 13px; line-height: 1.4; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  var KEY = "practiceRoom.v1";
  var PAGES = [
    { key: "scales", title: "Scales", glyph: "♯" },
    { key: "triads", title: "Triads", glyph: "♮" },
    { key: "rhythm", title: "Rhythm", glyph: "♩" },
    { key: "songs",  title: "Songs",  glyph: "♪", songs: true }
  ];
  function arr(n, v) { var a = []; for (var i = 0; i < n; i++) a.push(typeof v === "function" ? v() : v); return a; }
  function blank() {
    var d = { diary: "", pages: {}, titles: {}, songs: { names: arr(9, ""), charts: arr(9, ""), links: arr(9, function () { return arr(3, ""); }) } };
    PAGES.forEach(function (p) { if (!p.songs) d.pages[p.key] = arr(9, ""); });
    return d;
  }
  function str(x) { return typeof x === "string" ? x : ""; }
  function normalise(raw) {
    var d = blank();
    if (!raw || typeof raw !== "object") return d;
    d.diary = str(raw.diary);
    PAGES.forEach(function (p) {
      if (p.songs) return;
      var a = raw.pages && raw.pages[p.key];
      for (var i = 0; i < 9; i++) d.pages[p.key][i] = a ? str(a[i]) : "";
    });
    var s = raw.songs;
    if (s && typeof s === "object") {
      for (var i = 0; i < 9; i++) {
        d.songs.names[i] = s.names ? str(s.names[i]) : "";
        d.songs.charts[i] = s.charts ? str(s.charts[i]) : "";
        for (var j = 0; j < 3; j++) d.songs.links[i][j] = s.links && s.links[i] ? str(s.links[i][j]) : "";
      }
    }
    if (raw.titles && typeof raw.titles === "object") d.titles = raw.titles;
    return d;
  }
  var data;
  try { data = normalise(JSON.parse(localStorage.getItem(KEY))); } catch (e) { data = blank(); }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); setStatus("Saved on this device"); }
    catch (e) { setStatus("This browser is blocking saving. Turn off private browsing."); }
  }
  var timer = null;
  function queueSave() { clearTimeout(timer); setStatus("Saving…"); timer = setTimeout(persist, 400); }

  var app = document.getElementById("app");
  function setStatus(t) { var s = document.getElementById("status"); if (s) s.textContent = t; }
  function ytId(url) {
    var m = String(url || "").trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/i);
    return m ? m[1] : null;
  }
  function count(p) {
    if (p.songs) return data.songs.names.slice(0, 8).filter(function (n) { return n.trim(); }).length;
    return data.pages[p.key].filter(function (u) { return ytId(u); }).length;
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function statusRow() { return el("div", { class: "tools" }, [el("span", { class: "status", id: "status", role: "status" })]); }

  function getTitle(id, caption) {
    if (data.titles[id]) { caption.textContent = data.titles[id]; caption.classList.remove("dim"); return; }
    caption.textContent = "Loading title…"; caption.classList.add("dim");
    fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id))
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function (j) {
        data.titles[id] = j.title || "YouTube video";
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
        caption.textContent = data.titles[id]; caption.classList.remove("dim");
      })
      .catch(function () { caption.textContent = "Title not available"; });
  }

  /* one video square with its caption */
  function makeCell(url, n, label) {
    var id = ytId(url), cell = el("div", { class: "cell" });
    if (id) {
      var btn = el("button", { class: "clip thumb", type: "button", "aria-label": "Play clip " + n }, [
        el("span", { class: "n", text: String(n) }),
        el("img", { src: "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg", alt: "", loading: "lazy" }),
        el("span", { class: "play", "aria-hidden": "true", text: "▶" })
      ]);
      btn.addEventListener("click", function () {
        btn.replaceWith(el("div", { class: "clip" }, [el("iframe", {
          src: "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&playsinline=1&rel=0",
          title: label + " clip " + n,
          allow: "autoplay; encrypted-media; picture-in-picture; fullscreen", allowfullscreen: ""
        })]));
      });
      var cap = el("div", { class: "caption" });
      cell.appendChild(btn); cell.appendChild(cap); getTitle(id, cap);
    } else {
      cell.appendChild(el("div", { class: "clip empty" }, [
        el("span", { class: "n", text: String(n) }), el("span", { class: "big", "aria-hidden": "true", text: String(n) })
      ]));
      cell.appendChild(el("div", { class: "caption dim", text: " " }));
    }
    return cell;
  }

  /* a numbered paste line; onChange gets the trimmed value */
  function makeLine(n, value, placeholder, isLink, onChange) {
    var input = el("input", { id: "line" + n + Math.random().toString(36).slice(2, 6), type: isLink ? "url" : "text", autocomplete: "off", autocapitalize: isLink ? "off" : "words", placeholder: placeholder, "aria-label": placeholder + " " + n });
    input.value = value;
    function mark() { var v = input.value.trim(); input.classList.toggle("bad", isLink && v !== "" && !ytId(v)); }
    mark();
    input.addEventListener("input", function () { mark(); onChange(isLink ? input.value.trim() : input.value); });
    return el("div", { class: "row" }, [el("label", { for: input.id, text: n + "." }), input]);
  }
  function swap(holder, i, make) { var old = holder.children[i]; var fresh = make(); holder.replaceChild(fresh, old); }

  function home() {
    app.className = "wrap"; app.textContent = "";
    var tiles = el("nav", { class: "tiles", "aria-label": "Practice sections" });
    PAGES.forEach(function (p) {
      tiles.appendChild(el("a", { class: "tile", href: "#" + p.key }, [
        el("span", { class: "glyph", "aria-hidden": "true", text: p.glyph }),
        el("h2", { text: p.title }),
        el("span", { class: "count", text: count(p) + (p.songs ? " of 8 songs" : " of 9 clips") })
      ]));
    });
    var ta = el("textarea", { id: "diary", "aria-label": "Practice diary", placeholder: "What did you work on today? What felt good, what needs more time?" });
    ta.value = data.diary;
    ta.addEventListener("input", function () { data.diary = ta.value; queueSave(); });
    var dateBtn = el("button", { class: "quiet", type: "button", text: "Add today’s date" });
    dateBtn.addEventListener("click", function () {
      var d = new Date().toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n\n" : "") + d + "\n";
      data.diary = ta.value; ta.focus(); ta.scrollTop = ta.scrollHeight; queueSave();
    });

    var bk = el("textarea", { id: "backup", "aria-label": "Backup text", spellcheck: "false" });
    var bkMsg = el("span", { class: "status", role: "status" });
    var copyBtn = el("button", { class: "quiet", type: "button", text: "Show my backup" });
    copyBtn.addEventListener("click", function () {
      bk.value = JSON.stringify({ diary: data.diary, pages: data.pages, songs: data.songs });
      bk.select();
      try { navigator.clipboard.writeText(bk.value).then(function () { bkMsg.textContent = "Copied. Paste it into a note to keep it safe."; }, function () { bkMsg.textContent = "Select the text above and copy it."; }); }
      catch (e) { bkMsg.textContent = "Select the text above and copy it."; }
    });
    var restoreBtn = el("button", { class: "quiet", type: "button", text: "Restore from text" });
    restoreBtn.addEventListener("click", function () {
      try { var next = normalise(JSON.parse(bk.value)); next.titles = data.titles; data = next; persist(); home(); }
      catch (e) { bkMsg.textContent = "That text is not a valid backup."; }
    });
    var backup = el("details", { class: "backup" }, [
      el("summary", { text: "Backup and restore" }),
      el("div", { class: "box" }, [
        el("p", { class: "hint", text: "Your notes, links and chord charts live in this browser. Keep a copy in your Notes app in case the browser data is cleared, or to move to another device. To restore, paste a saved backup below and press Restore." }),
        bk, el("div", { class: "tools" }, [copyBtn, restoreBtn, bkMsg])
      ])
    ]);
    /* copy just the song titles and links, in the format the paste box on the Songs page reads */
    var sg = el("textarea", { id: "songexport", "aria-label": "Songs and links text", readonly: "readonly", spellcheck: "false" });
    sg.hidden = true;
    var sgMsg = el("span", { class: "status", role: "status" });
    var sgBtn = el("button", { class: "quiet", type: "button", text: "Copy songs and links" });
    sgBtn.addEventListener("click", function () {
      var last = -1;
      for (var i = 0; i < 8; i++) if (data.songs.names[i].trim() || data.songs.links[i].some(function (u) { return u; })) last = i;
      if (last < 0) { sgMsg.textContent = "No songs yet. Add titles on the Songs page first."; sg.hidden = true; return; }
      var ns = [], ls = [], real = 0;
      for (var k = 0; k <= last; k++) {
        ns.push(data.songs.names[k].trim() || "Song " + (k + 1));
        for (var j = 0; j < 3; j++) { var u = data.songs.links[k][j].trim(); if (u) real++; ls.push(u || "-"); }
      }
      sg.value = ns.join("\n") + "\n\n" + ls.join("\n");
      sg.hidden = false; sg.focus(); sg.select();
      var done = "Found " + ns.length + " songs and " + real + " links.";
      try { navigator.clipboard.writeText(sg.value).then(function () { sgMsg.textContent = done + " Copied. Paste it into a message or note."; }, function () { sgMsg.textContent = done + " Select the text above and copy it."; }); }
      catch (e) { sgMsg.textContent = done + " Select the text above and copy it."; }
    });
    var songShare = el("section", { class: "diary" }, [
      el("h2", { text: "Share my songs" }),
      el("p", { class: "hint", text: "Copies only your song titles and video links, without your diary or chord charts. Someone else pastes it into box 9 on their Songs page." }),
      sg, el("div", { class: "tools" }, [sgBtn, sgMsg])
    ]);

    app.appendChild(el("header", {}, [el("span", { class: "eyebrow", text: "Daily practice" }), el("h1", { text: "Practice Room" })]));
    app.appendChild(tiles);
    app.appendChild(el("section", { class: "diary" }, [el("h2", { text: "Diary" }), ta,
      el("div", { class: "tools" }, [dateBtn, el("span", { class: "status", id: "status", role: "status" })])]));
    app.appendChild(songShare);
    app.appendChild(backup);
  }

  function heading(title) {
    return el("div", { class: "page-title" }, [el("span", { class: "eyebrow", text: "Practice Room" }), el("h1", { text: title })]);
  }

  function clipPage(p) {
    app.className = "wrap"; app.textContent = "";
    var grid = el("div", { class: "grid9" }), links = el("div", { class: "links" });
    var urls = data.pages[p.key];
    for (var i = 0; i < 9; i++) grid.appendChild(makeCell(urls[i], i + 1, p.title));
    for (var j = 0; j < 9; j++) (function (i) {
      var last = ytId(urls[i]);
      links.appendChild(makeLine(i + 1, urls[i], "Paste a YouTube link", true, function (v) {
        urls[i] = v; queueSave();
        var now = ytId(v);
        if (now !== last) { last = now; swap(grid, i, function () { return makeCell(v, i + 1, p.title); }); }
      }));
    })(j);
    app.appendChild(el("a", { class: "back", href: "#", text: "← Practice Room" }));
    app.appendChild(heading(p.title));
    app.appendChild(grid); app.appendChild(links); app.appendChild(statusRow());
    app.appendChild(el("p", { class: "hint", text: "Tap a picture to play the clip here. Change or clear any line at any time; it saves on its own." }));
  }

  function songsPage() {
    app.className = "wrap"; app.textContent = "";
    var grid = el("div", { class: "grid9" }), lines = el("div", { class: "links names" });
    var names = data.songs.names;
    function box(i) {
      var nm = names[i].trim();
      return el("a", { class: "clip song" + (nm ? "" : " unnamed"), href: "#song-" + (i + 1), "aria-label": "Open " + (nm || "song " + (i + 1)) }, [
        el("span", { class: "n", text: String(i + 1) }),
        el("span", { class: "name", text: nm || String(i + 1) })
      ]);
    }
    for (var i = 0; i < 8; i++) grid.appendChild(box(i));
    grid.appendChild(el("a", { class: "clip song import", href: "#songs-import", "aria-label": "Open songs and links" }, [
      el("span", { class: "n", text: "9" }),
      el("span", { class: "name", text: "Songs & links" })
    ]));
    for (var j = 0; j < 8; j++) (function (i) {
      lines.appendChild(makeLine(i + 1, names[i], "Song title", false, function (v) {
        names[i] = v; queueSave(); swap(grid, i, function () { return box(i); });
      }));
    })(j);
    app.appendChild(el("a", { class: "back", href: "#", text: "← Practice Room" }));
    app.appendChild(heading("Songs"));
    app.appendChild(grid); app.appendChild(lines); app.appendChild(statusRow());
    app.appendChild(el("p", { class: "hint", text: "Type a song’s title on its numbered line. Tap its box to open the song’s page, with videos and a chord chart. Box 9 fills all the songs and links from one pasted document." }));
  }

  /* Reads a pasted document: song names first, then links (or a dash for a missing one), three per song. */
  function parseSongDoc(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l; });
    var names = [], entries = [], problems = [], inLinks = false;
    lines.forEach(function (l, idx) {
      var dash = /^[-–—]+$/.test(l), id = ytId(l), url = id ? (l.match(/https?:\/\/\S+/) || [l])[0] : "";
      if (dash) { inLinks = true; entries.push(""); }
      else if (id) { inLinks = true; entries.push(url); }
      else if (/^https?:\/\//i.test(l)) { inLinks = true; problems.push("“" + l.slice(0, 40) + "” is not a YouTube link."); entries.push(""); }
      else if (!inLinks) names.push(l.replace(/^\d+[.)]\s+/, ""));
      else problems.push("“" + l.slice(0, 40) + "” comes after the links begin. Song names go first.");
    });
    var r = { names: names, entries: entries, problems: problems, ok: false, message: "" };
    if (!names.length) r.problems.push("No song names found. Put the names first, one per line.");
    if (names.length > 8) r.problems.push("Found " + names.length + " song names. The most the page holds is 8.");
    if (names.length && entries.length && entries.length !== names.length * 3)
      r.problems.push("Expected " + names.length * 3 + " links (3 for each song, with a dash for any missing) but found " + entries.length + ".");
    if (!r.problems.length && !entries.length) {
      r.ok = true; r.noLinks = true;
      r.message = "Found " + names.length + " song titles and no links.";
    } else if (!r.problems.length) {
      r.ok = true;
      var real = entries.filter(function (u) { return u; }).length, short = [];
      for (var i = 0; i < names.length; i++) {
        var have = entries.slice(i * 3, i * 3 + 3).filter(function (u) { return u; }).length;
        if (have < 3) short.push((i + 1) + " (" + have + ")");
      }
      r.message = "Found " + names.length + " songs and " + real + " links." + (short.length ? " Fewer than 3 links: song " + short.join(", song ") + "." : "");
    }
    return r;
  }

  function importPage() {
    app.className = "wrap"; app.textContent = "";
    var ta = el("textarea", { id: "songdoc", "aria-label": "Songs and links document", spellcheck: "false", autocapitalize: "off",
      placeholder: "Dead Flowers\nTake It Easy\n...\n\nhttps://youtu.be/xxxxxxxxxxx\nhttps://youtu.be/yyyyyyyyyyy\n-\n..." });
    var summary = el("p", { class: "hint", id: "summary", role: "status" });
    var apply = el("button", { class: "quiet", type: "button", text: "Apply to my songs" });
    apply.disabled = true;
    var current = null;
    function check() {
      current = ta.value.trim() ? parseSongDoc(ta.value) : null;
      apply.disabled = !(current && current.ok);
      summary.textContent = !current ? "" : current.ok ? current.message + (current.noLinks ? " Press Apply to set the titles in boxes 1 to 8. This clears the links in those boxes." : " Press Apply to replace the titles and links in boxes 1 to 8.") : current.problems.join(" ");
    }
    try { ta.value = localStorage.getItem("practiceRoom.songdoc") || ""; } catch (e) {}
    ta.addEventListener("input", function () {
      try { localStorage.setItem("practiceRoom.songdoc", ta.value); } catch (e) {}
      check();
    });
    apply.addEventListener("click", function () {
      if (!current || !current.ok) return;
      for (var i = 0; i < 8; i++) {
        data.songs.names[i] = current.names[i] || "";
        for (var j = 0; j < 3; j++) data.songs.links[i][j] = current.names[i] && !current.noLinks ? current.entries[i * 3 + j] : "";
      }
      persist();
      try { localStorage.removeItem("practiceRoom.songdoc"); } catch (e) {}
      app.textContent = "";
      app.appendChild(el("a", { class: "back", href: "#songs", text: "← Songs" }));
      app.appendChild(heading("Songs & links"));
      app.appendChild(el("p", { text: "Done. " + current.message + " Chord charts were left as they were." }));
      app.appendChild(el("a", { class: "tile-link", href: "#songs", text: "Go to the Songs page" }));
    });
    app.appendChild(el("a", { class: "back", href: "#songs", text: "← Songs" }));
    app.appendChild(heading("Songs & links"));
    app.appendChild(el("p", { class: "hint", text: "Paste one document: the song names first, one per line (up to 8). You can stop there, or add the YouTube links after them, one per line, three for each song in the same order, with a single dash for any missing link. What you paste is kept here until you apply it. Applying replaces the titles and links in boxes 1 to 8 and keeps your chord charts." }));
    app.appendChild(ta); app.appendChild(summary); check();
    app.appendChild(el("div", { class: "tools" }, [apply, el("span", { class: "status", id: "status", role: "status" })]));
  }

  function songPage(k) {
    app.className = "wrap wide"; app.textContent = "";
    var i = k - 1, nm = data.songs.names[i].trim() || "Song " + k;
    var urls = data.songs.links[i];
    var stack = el("div", { class: "stack" }), links = el("div", { class: "links three" });
    for (var a = 0; a < 3; a++) stack.appendChild(makeCell(urls[a], a + 1, nm));
    for (var b = 0; b < 3; b++) (function (c) {
      var last = ytId(urls[c]);
      links.appendChild(makeLine(c + 1, urls[c], "Paste a YouTube link", true, function (v) {
        urls[c] = v; queueSave();
        var now = ytId(v);
        if (now !== last) { last = now; swap(stack, c, function () { return makeCell(v, c + 1, nm); }); }
      }));
    })(b);
    var chart = el("textarea", { id: "chart", "aria-label": "Chord chart for " + nm, wrap: "off", spellcheck: "false", autocapitalize: "off", placeholder: "Type your chord chart here.\nPut the chords on the line above the words:\n\n   G            D\nIt ain’t me, babe" });
    chart.value = data.songs.charts[i];
    chart.addEventListener("input", function () { data.songs.charts[i] = chart.value; queueSave(); });
    app.appendChild(el("a", { class: "back", href: "#songs", text: "← Songs" }));
    app.appendChild(heading(nm));
    app.appendChild(el("div", { class: "song-layout" }, [stack, el("div", { class: "paper-wrap" }, [el("div", { class: "paper-sheet" }, [chart])])]));
    app.appendChild(links); app.appendChild(statusRow());
  }

  function route() {
    var h = (location.hash || "").replace("#", "").toLowerCase();
    var sm = h.match(/^song-([1-8])$/);
    var p = PAGES.filter(function (x) { return x.key === h; })[0];
    if (sm) songPage(+sm[1]); else if (h === "songs-import") importPage(); else if (p && p.songs) songsPage(); else if (p) clipPage(p); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
